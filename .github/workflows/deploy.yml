name: Deploy

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release to deploy
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to deploy or roll back to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download published release
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$RELEASE_TAG" --pattern "web-dist-${RELEASE_TAG}.tar.zstd"
          mkdir deployment
          tar --zstd -xf "web-dist-${RELEASE_TAG}.tar.zstd" -C deployment

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deployment
          packageManager: npm
          command: deploy
