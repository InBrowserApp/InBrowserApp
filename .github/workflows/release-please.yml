name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: release-please
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  ci:
    name: CI
    needs: release-please
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha || github.sha }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [release-please, ci]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    outputs:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Create release archive
        run: tar -I 'zstd -T4 -15 --long=27' -cf "web-dist-${RELEASE_TAG}.tar.zstd" -C dist .

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: web-dist-${{ env.RELEASE_TAG }}.tar.zstd

      - name: Upload archive to draft release
        run: gh release upload "$RELEASE_TAG" "web-dist-${RELEASE_TAG}.tar.zstd" --clobber

      - name: Publish release
        id: publish
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          echo "prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Production
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.publish.outputs.tag_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
