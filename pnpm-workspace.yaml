# pnpm 10 catalogs do not support file: specifiers. Resolve the catalog's
# SheetJS version to the unchanged local distribution through an override.
overrides:
  xlsx: file:vendor/xlsx-0.20.3.tgz
  # These upstream dependency ranges still select vulnerable release lines.
  "basic-ftp@<6.2.6": "catalog:"
  "dompurify@<3.4.18": "catalog:"
  "glob@>=9 <14.0.6": "catalog:"
  "minimatch@>=7 <11.0.8": "catalog:"

allowBuilds:
  core-js: false
  es5-ext: false
  esbuild: true
  msw: true
  sharp: true
  tree-sitter: false
  tree-sitter-bash: false
  workerd: false

# Hoist @types/* to the workspace root so a single root tsc run can resolve
# types for every package without each one having to redeclare them. The
# canonical owner of each @types package still lives in the package that
# actually consumes the runtime dep (e.g. @types/react in apps/web).
publicHoistPattern:
  - "@types/*"

patchedDependencies:
  "curlconverter@4.12.0": "patches/curlconverter@4.12.0.patch"
  "foliate-js@1.0.1": "patches/foliate-js@1.0.1.patch"
